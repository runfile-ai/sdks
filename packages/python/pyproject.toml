[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runfile-ai"
version = "0.4.0"
description = "Runfile SDK — tamper-evident audit capture for AI agents (LangGraph, OpenAI Agents, Claude Agent SDK, MCP)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Runfile", email = "engineering@runfile.ai" }]
keywords = ["ai", "agents", "audit", "observability", "compliance", "langgraph"]
dependencies = [
  "httpx>=0.27",
  "cryptography>=42.0",
  # Pinned to one schemas minor: pre-1.0 minors have changed the event hash
  # projection (0.7, 0.8), and an SDK hashing with a different projection than
  # the platform produces false chain breaks. 0.10 adds the `sandbox` environment.
  "runfile-ai-schemas>=0.10,<0.11",
]

[project.urls]
Homepage = "https://runfile.ai"
Documentation = "https://docs.runfile.ai"
Source = "https://github.com/runfile-ai/sdks"

[project.optional-dependencies]
# >=1.0: first release with langgraph.callbacks.GraphCallbackHandler (the sync
# handler exposing on_interrupt / on_resume the adapter relies on for HITL capture).
# On older langgraph the adapter still loads (falls back to the plain LangChain
# BaseCallbackHandler) but can't observe graph interrupt / resume.
langgraph = ["langgraph>=1.0"]
# <0.18: on newer openai-agents (seen on 0.23.1) the adapter captures a
# human-approved tool call out of order — tool_call before
# tool_approval_requested — which misstates HITL in the audit trail. Capped to
# the tested range until the adapter is fixed:
# https://github.com/runfile-ai/sdks/issues/16
# openai<2.42: newer openai makes InputTokensDetails require a field that
# openai-agents 0.17.x does not set, so Runner.run crashes inside the
# framework (seen on openai 2.54.0). 2.41.0 is the tested version.
openai-agents = ["openai-agents>=0.1,<0.18", "openai<2.42"]
# >=0.1.29: first release with the Notification, SubagentStart, and
# PermissionRequest hook events (PostToolUseFailure landed in 0.1.26). Older
# installs silently ignore unknown hook keys, so the adapter version-checks too.
anthropic = ["claude-agent-sdk>=0.1.29"]
mcp = ["mcp>=1.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  # Exact pins: lint/type results change across releases (ruff 0.17 widened
  # its default rule set and flags ~250 existing lines), so a floating range
  # turns every upstream release into a CI failure. Bump deliberately and fix
  # what the new version reports in the same PR.
  "mypy==2.1.0",
  "ruff==0.15.15",
  # The LangGraph adapter tests drive a real graph; without this the suite
  # importorskips them. langchain-core comes transitively.
  "langgraph>=1.0",
  # The OpenAI Agents adapter tests drive a real Runner with a scripted model;
  # without this the suite importorskips them. openai comes transitively.
  # Same caps as the openai-agents extra (issue #16).
  "openai-agents>=0.1,<0.18",
  "openai<2.42",
]

[tool.hatch.build.targets.wheel]
packages = ["runfile_ai"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

# runfile-ai-schemas (generated) ships models but no py.typed marker yet.
# TODO: drop this once the schemas repo adds py.typed to the generated package.
[[tool.mypy.overrides]]
module = "runfile_schemas.*"
ignore_missing_imports = true

# Optional framework SDKs — imported lazily inside adapters, never required to
# install or type-check the core. (Each is an extra in [project.optional-dependencies].)
[[tool.mypy.overrides]]
module = [
  "claude_agent_sdk.*",
  "langgraph.*",
  "langchain_core.*",
  "agents.*",
  "mcp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
