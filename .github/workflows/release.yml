name: Release

# TypeScript (@runfile-ai/sdk) → npm via changesets.
# Python (runfile-ai) → PyPI via trusted publishing (OIDC, no token).
# Verifier CLI → cross-platform binaries attached to a GitHub Release on tag.
#
# On push to main: if changesets are pending, open/update the "Version Packages"
# PR. When merged (no changesets remain), publish the TS package and tag.

on:
  push:
    branches: [main]
    tags:
      - 'verifier-cli/v*'

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    if: startsWith(github.ref, 'refs/tags/') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm run changeset:version
          publish: pnpm run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    # Trusted publishing matches the workflow + environment configured at
    # pypi.org/manage/account/publishing/ for the `runfile-ai` project.
    if: startsWith(github.ref, 'refs/tags/') == false
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/runfile-ai/
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist

  verifier-cli:
    if: startsWith(github.ref, 'refs/tags/verifier-cli/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/verifier-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      # TODO: matrix build linux/macos/windows × amd64/arm64; attach to release.
      - run: go build -o bin/runfile-verifier ./cmd/runfile-verifier
