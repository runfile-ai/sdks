name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version comes from package.json "packageManager" (pnpm@9.12.0); passing it
      # here too makes pnpm/action-setup error with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @runfile-ai/sdk run lint
      - run: pnpm --filter @runfile-ai/sdk run build
      - run: pnpm --filter @runfile-ai/sdk run test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy runfile_ai
      - run: pytest

  verifier-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/verifier-cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
